<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Evolução Saúde</title>
  
  <link rel="apple-touch-icon" sizes="180x180" href="https://cassioancn.github.io/evolucao-saude/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="https://cassioancn.github.io/evolucao-saude/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://cassioancn.github.io/evolucao-saude/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="https://cassioancn.github.io/evolucao-saude/icon-512.png">
  <link rel="manifest" href="https://cassioancn.github.io/evolucao-saude/manifest.json">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Evolução Saúde">
  <meta name="theme-color" content="#0d9488">
  
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0f172a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #f8fafc; z-index: 10; transition: opacity 0.4s ease;
    }
    #loading img {
      width: 90px; height: 90px; border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 16px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #0d9488; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-top: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <div id="loading">
    <img src="https://cassioancn.github.io/evolucao-saude/apple-touch-icon.png" alt="Evolução Saúde">
    <div style="font-weight: 700; font-size: 18px; letter-spacing: 0.5px; color: #2dd4bf;">Evolução Saúde</div>
    <div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">Carregando seu painel de saúde...</div>
    <div class="spinner"></div>
  </div>

  <iframe
    id="app-frame"
    src="https://share.streamlit.io/cassioancn/evolucao-saude/main/app.py?embed=true"
    allow="clipboard-read; clipboard-write; geolocation"
    onload="document.getElementById('loading').style.opacity='0'; setTimeout(() => document.getElementById('loading').style.display='none', 400);"
  ></iframe>
</body>
</html>
