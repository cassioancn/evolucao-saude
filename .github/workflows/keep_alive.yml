name: Keep App Alive (Playwright Auto-Wake)

on:
  schedule:
    # Executa a cada 4 horas (02:00, 06:00, 10:00, 14:00, 18:00, 22:00 UTC) alternando com Radar Julius
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo GitHub

jobs:
  auto-wake:
    name: Wake and Keep App Alive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run Auto-Wake Script
        run: python scripts/auto_wake.py
